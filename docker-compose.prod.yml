# Production compose — uses pre-built images from Docker Hub.

services:
  backend:
    image: bobanboshevski/energy-forecast-backend:latest
    container_name: energy-forecast-backend
    env_file:
      - ./backend/.env
    ports:
      - "8002:8002"
    tmpfs:
      - /tmp:exec,mode=1777
    environment:
      - TMPDIR=/tmp
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8002/health" ]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

  frontend:
    image: bobanboshevski/energy-forecast-frontend:latest
    container_name: energy-forecast-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: energy-forecast-network