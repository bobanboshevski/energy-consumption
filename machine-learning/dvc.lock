    - path: src/models/train.py
      hash: md5
      md5: b7343def908650295d39caae8c2c82c0
      size: 11113
    params:
      params.yaml:
        train.feature_cols:
        - temp_max
        - temp_min
        - daylight_duration
        train.random_state: 42
        train.target_col: energy_demand
        train.test_size: 90
        train.window_size: 30
