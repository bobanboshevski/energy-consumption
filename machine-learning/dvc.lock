      hash: md5
      md5: a93f9fafa893260e900b056f393825a2
      size: 3680
    outs:
    - path: data/reference
      hash: md5
      md5: 41a569c446249b96d68ff9b717e76ed3.dir
      size: 119922
      nfiles: 1
  train:
    cmd: "uv run python src/models/train.py\ngit commit -am \"Updated model on `date`
