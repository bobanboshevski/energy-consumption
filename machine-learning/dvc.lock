      hash: md5
      md5: a93f9fafa893260e900b056f393825a2
      size: 3680
    outs:
    - path: data/reference
      hash: md5
      md5: 8dca647d02d14ee2d0b4e5862d1cd03f.dir
      size: 118261
      nfiles: 1
  train:
    cmd: "uv run python src/models/train.py\ngit commit -am \"Updated model on `date`
