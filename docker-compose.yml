services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: energy-forecast-backend
    ports:
      - "8002:8002"
    tmpfs:
      - /tmp:exec,mode=1777
    environment:
      - TMPDIR=/tmp
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8002
    container_name: energy-forecast-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: energy-forecast-network