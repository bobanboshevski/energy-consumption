name: Energy Forecast CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Backend and frontend run in parallel
  call-backend:
    name: Backend
    uses: ./.github/workflows/backend.yml
    secrets: inherit

  call-frontend:
    name: Frontend
    uses: ./.github/workflows/frontend.yml
    secrets: inherit